<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervisor Login — Y-TRAK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 36px 32px; width: 100%; max-width: 400px; }
  h1 { font-size: 20px; font-weight: bold; margin: 0 0 4px; text-align: center; color: #111; }
  .dept { font-size: 13px; color: #888; text-align: center; margin: 0 0 4px; }
  .tagline { font-size: 13px; color: #666; text-align: center; margin: 0 0 28px; }
  .badge { display: block; width: fit-content; margin: 0 auto 20px; background: #1a3a6b; color: #fff; font-size: 11px; padding: 3px 12px; border-radius: 20px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
  label { font-size: 12px; color: #555; font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; }
  input { background: #f7f7f7; border: 1px solid #ccc; border-radius: 7px; padding: 10px 12px; font-size: 15px; color: #111; width: 100%; font-family: Arial, sans-serif; }
  input:focus { outline: none; border-color: #1a5dc8; background: #fff; }
  .btn { width: 100%; padding: 12px; font-size: 15px; font-weight: bold; border: none; border-radius: 7px; background: #1a5dc8; color: #fff; cursor: pointer; margin-top: 8px; font-family: Arial, sans-serif; }
  .btn:hover { background: #154fa8; }
  .btn:disabled { background: #aaa; cursor: default; }
  .error { background: #fff0f0; border: 1px solid #f0b0b0; border-radius: 7px; padding: 10px 14px; font-size: 13px; color: #a00; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="card">
  <p class="dept">Yalobusha County Sheriff's Department</p>
  <h1>Y-TRAK</h1>
  <p class="tagline">Supervisor Portal</p>
  <span class="badge">Authorized Personnel Only</span>

  <div class="field">
    <label>Email address</label>
    <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" id="login-btn" onclick="doLogin()">Sign in</button>
  <div class="error" id="error-msg"></div>
</div>

<script>
const sb = supabase.createClient(
  'https://kwgfonwgeoievgxwvxlg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3Z2ZvbndnZW9pZXZneHd2eGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4Mzk4MDQsImV4cCI6MjA5MTQxNTgwNH0.KrH-loytrritpSgy6MVBmT0KyyodDp27ZLSATm1dGsM'
);

sb.auth.getSession().then(({ data }) => {
  if (data.session) redirectByRole(data.session.user.id);
});

async function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('login-btn');
  const err      = document.getElementById('error-msg');
  err.style.display = 'none';
  if (!email || !password) { showErr('Please enter your email and password.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    showErr('Invalid email or password. Please try again.');
    btn.disabled = false; btn.textContent = 'Sign in';
    return;
  }
  await redirectByRole(data.user.id);
  btn.disabled = false; btn.textContent = 'Sign in';
}

async function redirectByRole(userId) {
  const { data: profile } = await sb.from('supervisors').select('role').eq('id', userId).single();
  if (!profile) { showErr('Your account does not have portal access.'); await sb.auth.signOut(); return; }
  if (profile.role === 'reviewer')  { window.location.href = '/validate.html';  return; }
  if (profile.role === 'payroll')   { window.location.href = '/payroll.html';   return; }
  window.location.href = '/dashboard.html';
}

function showErr(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
