<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-TRAK — Under Maintenance</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 14px; padding: 48px 36px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .logo { font-size: 28px; font-weight: 900; color: #1a3a6b; letter-spacing: 2px; margin: 0 0 4px; }
  .dept { font-size: 12px; color: #888; margin: 0 0 32px; }
  .icon { font-size: 52px; margin-bottom: 16px; }
  .title { font-size: 20px; font-weight: bold; color: #111; margin: 0 0 12px; }
  .message { font-size: 14px; color: #555; line-height: 1.7; margin: 0 0 28px; }
  .badge { display: inline-block; background: #fff8e0; color: #8a6000; border: 1px solid #e0c060; font-size: 12px; font-weight: bold; padding: 6px 18px; border-radius: 20px; }
  .footer { font-size: 11px; color: #aaa; margin-top: 28px; }
</style>
</head>
<body>
<div class="card">
  <p class="logo">Y-TRAK</p>
  <p class="dept">Yalobusha County Sheriff's Department</p>
  <div class="icon">🔧</div>
  <h1 class="title">Under Maintenance</h1>
  <p class="message">
    The employee timesheet portal is temporarily unavailable while we make updates.
    Please check back shortly. We apologize for any inconvenience.
  </p>
  <span class="badge">⚠ Temporarily Unavailable</span>
  <p class="footer">If you have questions, please contact your supervisor.</p>
</div>
</body>
</html>
