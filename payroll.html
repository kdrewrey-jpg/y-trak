<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-TRAK Payroll</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; color: #111; }
  .topbar { background: #1a3a6b; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 16px; font-weight: bold; margin: 0 0 2px; }
  .topbar p { font-size: 12px; opacity: 0.75; margin: 0; }
  .sign-out { font-size: 13px; color: #aac4f0; cursor: pointer; background: none; border: none; font-family: Arial, sans-serif; text-decoration: underline; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px 20px; }
  .stat-num { font-size: 28px; font-weight: bold; color: #1a5dc8; margin: 0 0 4px; }
  .stat-label { font-size: 12px; color: #888; margin: 0; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filter-grp { display: flex; align-items: center; gap: 6px; }
  .filter-grp label { font-size: 12px; color: #555; font-weight: bold; }
  .filter-grp select { border: 1px solid #ccc; border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: Arial, sans-serif; background: #fff; }
  .tb-btn { font-size: 13px; font-weight: bold; padding: 8px 16px; border-radius: 8px; border: 1px solid #bbb; background: #f5f5f5; color: #111; cursor: pointer; display: flex; align-items: center; gap: 7px; font-family: Arial, sans-serif; white-space: nowrap; }
  .tb-btn:hover { background: #e8e8e8; }
  .tb-btn.primary { background: #1a5dc8; color: #fff; border-color: #1a5dc8; }
  .tb-btn.primary:hover { background: #154fa8; }
  .tb-btn:disabled { opacity: 0.5; cursor: default; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th { background: #f5f5f5; padding: 10px 14px; text-align: left; font-size: 12px; color: #555; font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid #ddd; white-space: nowrap; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid #eee; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f8f9ff; }
  .badge-approved { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: bold; background: #eaf7ee; color: #1a6a30; border: 1px solid #a0d8b0; }
  .print-btn { padding: 6px 14px; font-size: 12px; border: 1px solid #1a5dc8; border-radius: 6px; background: #fff; color: #1a5dc8; cursor: pointer; font-family: Arial, sans-serif; display: inline-flex; align-items: center; gap: 5px; }
  .print-btn:hover { background: #e8f0ff; }
  .empty { text-align: center; padding: 40px; color: #888; font-size: 14px; }
  .loading { text-align: center; padding: 40px; color: #888; }
  .bulk-progress { background: #e8f0fe; border: 1px solid #aac4f0; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #1a3a6b; margin-bottom: 14px; display: none; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Y-TRAK — Payroll Portal</h1>
    <p>Yalobusha County Sheriff's Department — Approved Timesheets</p>
  </div>
  <button class="sign-out" onclick="signOut()">Sign out</button>
</div>

<div class="container">

  <div class="stats">
    <div class="stat"><p class="stat-num" id="stat-total">—</p><p class="stat-label">Total approved</p></div>
    <div class="stat"><p class="stat-num" id="stat-month">—</p><p class="stat-label">Shown (current filter)</p></div>
    <div class="stat"><p class="stat-num" id="stat-hrs">—</p><p class="stat-label">Total hours (filtered)</p></div>
  </div>

  <div class="toolbar">
    <div class="filter-grp">
      <label>Month:</label>
      <select id="filter-month" onchange="renderTable()">
        <option value="">All months</option>
        <option>January</option><option>February</option><option>March</option>
        <option>April</option><option>May</option><option>June</option>
        <option>July</option><option>August</option><option>September</option>
        <option>October</option><option>November</option><option>December</option>
      </select>
    </div>
    <div class="filter-grp">
      <label>Year:</label>
      <select id="filter-year" onchange="renderTable()">
        <option value="">All years</option>
        <option>2024</option><option>2025</option><option>2026</option><option>2027</option>
      </select>
    </div>
    <button class="tb-btn primary" id="bulk-print-btn" onclick="bulkPrint()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="3" y="1" width="10" height="5" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1" y="6" width="14" height="7" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="4" y="10" width="8" height="4" rx="0.5" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="12" cy="9" r="1" fill="currentColor"/></svg>
      Print all filtered
    </button>
  </div>

  <div class="bulk-progress" id="bulk-progress"></div>

  <div class="card">
    <div id="loading" class="loading">Loading timesheets…</div>
    <table id="sheet-table" style="display:none;">
      <thead><tr>
        <th>Employee</th>
        <th>Period</th>
        <th>Total Hrs</th>
        <th>Approved By</th>
        <th>Approved On</th>
        <th>Status</th>
        <th></th>
      </tr></thead>
      <tbody id="sheet-body"></tbody>
    </table>
    <div id="sheet-empty" class="empty" style="display:none;">No approved timesheets found.</div>
  </div>

</div>

<script>
if (!sessionStorage.getItem('ytrak-staff')) window.location.href = '/supervisor.html';

const sb = supabase.createClient(
  'https://kwgfonwgeoievgxwvxlg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3Z2ZvbndnZW9pZXZneHd2eGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4Mzk4MDQsImV4cCI6MjA5MTQxNTgwNH0.KrH-loytrritpSgy6MVBmT0KyyodDp27ZLSATm1dGsM'
);

let allSheets = [];
let filtered  = [];

async function init() {
  await sb.auth.signOut();
  setDefaultFilter();
  await loadSheets();
}

function setDefaultFilter() {
  const now = new Date();
  const monthName = now.toLocaleString('default', { month: 'long' });
  const year = String(now.getFullYear());
  const mSel = document.getElementById('filter-month');
  const ySel = document.getElementById('filter-year');
  for (let i = 0; i < mSel.options.length; i++) { if (mSel.options[i].text === monthName) { mSel.selectedIndex = i; break; } }
  for (let i = 0; i < ySel.options.length; i++) { if (ySel.options[i].text === year) { ySel.selectedIndex = i; break; } }
}

async function loadSheets() {
  const { data, error } = await sb.from('timesheets').select('*').eq('status','approved').order('approved_at', { ascending: false });
  if (error) { document.getElementById('loading').textContent = 'Error loading timesheets.'; return; }
  allSheets = data || [];
  document.getElementById('stat-total').textContent = allSheets.length;
  renderTable();
}

function renderTable() {
  const fm = document.getElementById('filter-month').value;
  const fy = document.getElementById('filter-year').value;
  filtered = allSheets.filter(s => {
    if (fm && s.month !== fm) return false;
    if (fy && s.year  !== fy) return false;
    return true;
  });

  const totalHrs = filtered.reduce((acc,s) => acc + (parseFloat(s.total_hours)||0), 0);
  document.getElementById('stat-month').textContent = filtered.length;
  document.getElementById('stat-hrs').textContent   = totalHrs.toFixed(2);
  document.getElementById('loading').style.display  = 'none';

  const bulkBtn = document.getElementById('bulk-print-btn');
  bulkBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="3" y="1" width="10" height="5" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1" y="6" width="14" height="7" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="4" y="10" width="8" height="4" rx="0.5" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="12" cy="9" r="1" fill="currentColor"/></svg> Print all filtered (${filtered.length})`;

  if (filtered.length === 0) {
    document.getElementById('sheet-table').style.display = 'none';
    document.getElementById('sheet-empty').style.display = 'block';
    return;
  }

  const tbody = document.getElementById('sheet-body');
  tbody.innerHTML = filtered.map(s => `<tr>
    <td><strong>${s.employee_name}</strong><br><span style="font-size:12px;color:#888;">${s.employment_status}</span></td>
    <td>${s.month} ${s.year}</td>
    <td>${s.total_hours}</td>
    <td>${s.approved_by_name||'—'}</td>
    <td>${s.approved_at ? new Date(s.approved_at).toLocaleDateString() : '—'}</td>
    <td><span class="badge-approved">Approved</span></td>
    <td>
      <button class="print-btn" onclick="printSingle('${s.id}')">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="3" y="1" width="10" height="5" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1" y="6" width="14" height="7" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="4" y="10" width="8" height="4" rx="0.5" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="12" cy="9" r="1" fill="currentColor"/></svg>
        Print
      </button>
    </td>
  </tr>`).join('');

  document.getElementById('sheet-table').style.display = 'table';
  document.getElementById('sheet-empty').style.display = 'none';
}

function getSigDimensions(src, maxW, maxH) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => { const ratio=img.naturalHeight/img.naturalWidth; let w=Math.min(img.naturalWidth,maxW),h=w*ratio; if(h>maxH){h=maxH;w=h/ratio;} resolve({w,h}); };
    img.onerror = () => resolve({w:maxW*0.6,h:maxH*0.6});
    img.src = src;
  });
}

async function buildSheetPDF(doc, d, startY) {
  const ml=36, mr=576, pw=mr-ml;
  let y = startY;
  doc.setFont('helvetica','bold'); doc.setFontSize(14.5);
  doc.text("Yalobusha County Sheriff's Department", ml, y); y+=17;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text('Time and Attendance', ml, y); y+=21;
  const colW = pw/2;
  [[['Name:',d.employee_name],['Last 4 of Social:',d.ssn_last4]],[['Employment Status:',d.employment_status]],[['Current Month:',d.month],['Current Year:',d.year]]].forEach(row=>{
    row.forEach((item,i)=>{ const x=ml+i*colW; doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.text(item[0],x,y); const lw=doc.getTextWidth(item[0])+4; doc.setFont('helvetica','normal'); doc.text(item[1]||'',x+lw,y); doc.line(x+lw,y+1,x+colW-6,y+1); }); y+=15;
  }); y+=6;
  const cols=[{label:'Day',w:26},{label:'Start',w:52},{label:'End',w:52},{label:'Total Hrs',w:54},{label:'Comp Hrs',w:54},{label:'Sick Hrs',w:54},{label:'Notes',w:pw-26-52-52-54-54-54}];
  const rowH=13.5, hdrH=16.5;
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setFillColor(240,240,240);
  doc.rect(ml,y,pw,hdrH,'FD'); let cx=ml;
  cols.forEach(col=>{doc.text(col.label,cx+2,y+11.5);cx+=col.w;if(cx<mr)doc.line(cx,y,cx,y+hdrH);});
  y+=hdrH; doc.setFont('helvetica','normal'); doc.setFontSize(8);
  const allRows=[];
  for(let day=1;day<=31;day++){ const found=(d.rows||[]).find(r=>parseInt(r.day)===day); allRows.push(found||{day:String(day),start:'',end:'',total:'',comp:'',sick:'',notes:''}); }
  allRows.forEach(row=>{ const vals=[row.day,row.start,row.end,row.total,row.comp,row.sick,row.notes]; doc.rect(ml,y,pw,rowH); cx=ml; cols.forEach((col,i)=>{if(vals[i])doc.text(String(vals[i]),cx+2,y+9.5);cx+=col.w;if(cx<mr)doc.line(cx,y,cx,y+rowH);}); y+=rowH; });
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setFillColor(240,240,240);
  doc.rect(ml,y,pw,rowH,'FD');
  const totW=cols[0].w+cols[1].w+cols[2].w;
  doc.text('Total Hours:',ml+totW-doc.getTextWidth('Total Hours:')-4,y+9.5); cx=ml+totW;
  [d.total_hours,d.comp_hours,d.sick_hours].forEach((val,i)=>{if(val)doc.text(val,cx+2,y+9.5);cx+=cols[3+i].w;if(cx<mr)doc.line(cx,y,cx,y+rowH);});
  y+=rowH+20;
  const sigW=(pw-32)/2, sigH=44;
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
  doc.text('Employee Signature:',ml,y); doc.text('Chief Deputy Signature:',ml+sigW+32,y); y+=6;
  if(d.emp_signature&&d.emp_signature.startsWith('data:image')){ try{const dims=await getSigDimensions(d.emp_signature,sigW-8,sigH-8);doc.addImage(d.emp_signature,'PNG',ml+4,y+(sigH-dims.h)/2,dims.w,dims.h);}catch(e){} }
  doc.line(ml,y+sigH,ml+sigW,y+sigH);
  if(d.dep_signature&&d.dep_signature.startsWith('data:image')){ try{const dims=await getSigDimensions(d.dep_signature,sigW-8,sigH-8);doc.addImage(d.dep_signature,'PNG',ml+sigW+36,y+(sigH-dims.h)/2,dims.w,dims.h);}catch(e){} }
  doc.line(ml+sigW+32,y+sigH,ml+sigW+32+sigW,y+sigH);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  const depX=ml+sigW+32; let depTextY=y+sigH+10;
  if(d.reviewed_by_name){ doc.setTextColor(30,80,160); doc.text(`Validated by ${d.reviewed_by_name}`,depX,depTextY); depTextY+=10; doc.text(`on ${new Date(d.reviewed_at).toLocaleString()}`,depX,depTextY); depTextY+=12; }
  if(d.approved_by_name){ doc.setTextColor(30,122,60); doc.setFont('helvetica','italic'); doc.text(`Approved by ${d.approved_by_name}`,depX,depTextY); depTextY+=10; doc.text(`on ${new Date(d.approved_at).toLocaleString()}`,depX,depTextY); }
  doc.setTextColor(0,0,0);
}

async function printSingle(id) {
  const s = allSheets.find(x => x.id === id);
  if (!s) return;
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait',unit:'pt',format:'letter'});
  await buildSheetPDF(doc, s, 36);
  const blob = doc.output('blob');
  const url  = URL.createObjectURL(blob);
  const win  = window.open(url);
  if (win) win.onload = () => { win.focus(); win.print(); };
}

async function bulkPrint() {
  if (filtered.length === 0) { alert('No timesheets to print. Adjust your filter and try again.'); return; }
  const fm = document.getElementById('filter-month').value || 'All';
  const fy = document.getElementById('filter-year').value  || 'periods';
  if (!confirm(`Print all ${filtered.length} approved timesheet(s) for ${fm} ${fy}?`)) return;

  const btn      = document.getElementById('bulk-print-btn');
  const progress = document.getElementById('bulk-progress');
  btn.disabled   = true;
  progress.style.display = 'block';

  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'portrait',unit:'pt',format:'letter'});

  for (let i = 0; i < filtered.length; i++) {
    const s = filtered[i];
    progress.textContent = `Building PDF… ${i+1} of ${filtered.length} (${s.employee_name})`;
    if (i > 0) doc.addPage();
    await buildSheetPDF(doc, s, 36);
  }

  progress.textContent = 'Opening print dialog…';
  const blob = doc.output('blob');
  const url  = URL.createObjectURL(blob);
  const win  = window.open(url);
  if (win) win.onload = () => { win.focus(); win.print(); };

  btn.disabled = false;
  progress.style.display = 'none';
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="3" y="1" width="10" height="5" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1" y="6" width="14" height="7" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="4" y="10" width="8" height="4" rx="0.5" stroke="currentColor" stroke-width="1.2" fill="none"/><circle cx="12" cy="9" r="1" fill="currentColor"/></svg> Print all filtered (${filtered.length})`;
}

function signOut() { sessionStorage.removeItem('ytrak-staff'); window.location.href = '/supervisor.html'; }

init();
</script>
</body>
</html>
