<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-TRAK Supervisors</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; color: #111; }
  .topbar { background: #1a3a6b; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-left h1 { font-size: 16px; font-weight: bold; margin: 0 0 2px; }
  .topbar-left p { font-size: 12px; opacity: 0.75; margin: 0; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .user-name { font-size: 13px; opacity: 0.85; }
  .sign-out { font-size: 13px; color: #aac4f0; cursor: pointer; background: none; border: none; font-family: Arial, sans-serif; text-decoration: underline; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px 20px; }
  .stat-num { font-size: 28px; font-weight: bold; color: #1a5dc8; margin: 0 0 4px; }
  .stat-label { font-size: 12px; color: #888; margin: 0; }
  .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
  .tab { padding: 10px 20px; font-size: 14px; cursor: pointer; border: none; background: none; color: #666; font-family: Arial, sans-serif; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #1a5dc8; border-bottom-color: #1a5dc8; font-weight: bold; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th { background: #f5f5f5; padding: 10px 14px; text-align: left; font-size: 12px; color: #555; font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid #ddd; white-space: nowrap; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid #eee; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f8f9ff; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: bold; }
  .badge-pending { background: #fff8e0; color: #8a6000; border: 1px solid #e0c060; }
  .badge-reviewed { background: #e8f0fe; color: #1a3a6b; border: 1px solid #aac4f0; }
  .badge-approved { background: #eaf7ee; color: #1a6a30; border: 1px solid #a0d8b0; }
  .review-btn { padding: 6px 14px; font-size: 13px; border: 1px solid #1a5dc8; border-radius: 6px; background: #fff; color: #1a5dc8; cursor: pointer; font-family: Arial, sans-serif; }
  .review-btn:hover { background: #e8f0ff; }
  .empty { text-align: center; padding: 40px; color: #888; font-size: 14px; }
  .loading { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <h1>Y-TRAK — Supervisor Portal</h1>
    <p>Yalobusha County Sheriff's Department</p>
  </div>
  <div class="topbar-right">
    <span class="user-name" id="user-name"></span>
    <button class="sign-out" onclick="signOut()">Sign out</button>
  </div>
</div>

<div class="container">
  <div class="stats">
    <div class="stat"><p class="stat-num" id="stat-pending">—</p><p class="stat-label" id="stat-pending-label">Pending</p></div>
    <div class="stat"><p class="stat-num" id="stat-second">—</p><p class="stat-label" id="stat-second-label">—</p></div>
    <div class="stat"><p class="stat-num" id="stat-total">—</p><p class="stat-label">Total submissions</p></div>
  </div>

  <div class="tabs" id="tab-bar"></div>

  <div class="card">
    <div id="loading" class="loading">Loading timesheets…</div>
    <table id="sheet-table" style="display:none;">
      <thead><tr>
        <th>Employee</th>
        <th>Period</th>
        <th>Total Hrs</th>
        <th>Submitted</th>
        <th>Status</th>
        <th></th>
      </tr></thead>
      <tbody id="sheet-body"></tbody>
    </table>
    <div id="sheet-empty" class="empty" style="display:none;">No timesheets found.</div>
  </div>
</div>

<script>
const sb = supabase.createClient(
  'https://kwgfonwgeoievgxwvxlg.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3Z2ZvbndnZW9pZXZneHd2eGxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4Mzk4MDQsImV4cCI6MjA5MTQxNTgwNH0.KrH-loytrritpSgy6MVBmT0KyyodDp27ZLSATm1dGsM'
);

let allSheets = [];
let currentTab = 'pending';
let currentSupervisor = null;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/supervisor.html'; return; }

  const { data: profile } = await sb.from('supervisors').select('*').eq('id', session.user.id).single();
  currentSupervisor = profile;
  document.getElementById('user-name').textContent = profile?.name || session.user.email;

  buildTabs();
  await loadSheets();
}

function buildTabs() {
  const tabBar = document.getElementById('tab-bar');
  if (currentSupervisor?.role === 'reviewer') {
    tabBar.innerHTML = `
      <button class="tab active" id="tab-pending"  onclick="showTab('pending')">Pending</button>
      <button class="tab"        id="tab-reviewed" onclick="showTab('reviewed')">Validated</button>`;
    document.getElementById('stat-second-label').textContent = 'Validated';
  } else {
    tabBar.innerHTML = `
      <button class="tab active" id="tab-pending"  onclick="showTab('pending')">Pending Approval</button>
      <button class="tab"        id="tab-approved" onclick="showTab('approved')">Approved</button>
      <button class="tab"        id="tab-all"      onclick="showTab('all')">All Timesheets</button>`;
    document.getElementById('stat-pending-label').textContent = 'Awaiting approval';
    document.getElementById('stat-second-label').textContent  = 'Approved this month';
  }
}

async function loadSheets() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('sheet-table').style.display = 'none';
  document.getElementById('sheet-empty').style.display = 'none';

  const { data, error } = await sb.from('timesheets').select('*').order('submitted_at', { ascending: false });
  if (error) { document.getElementById('loading').textContent = 'Error loading timesheets.'; return; }

  allSheets = data || [];
  const thisMonth = new Date().toLocaleString('default', { month: 'long' });

  if (currentSupervisor?.role === 'reviewer') {
    document.getElementById('stat-pending').textContent = allSheets.filter(s => s.status === 'pending').length;
    document.getElementById('stat-second').textContent  = allSheets.filter(s => s.status === 'reviewed').length;
  } else {
    document.getElementById('stat-pending').textContent = allSheets.filter(s => s.status === 'reviewed').length;
    document.getElementById('stat-second').textContent  = allSheets.filter(s => s.status === 'approved' && s.month === thisMonth).length;
  }
  document.getElementById('stat-total').textContent = allSheets.length;

  renderTab(currentTab);
}

function getBadge(status) {
  if (status === 'approved') return '<span class="badge badge-approved">Approved</span>';
  if (status === 'reviewed') return '<span class="badge badge-reviewed">Validated</span>';
  return '<span class="badge badge-pending">Pending</span>';
}

function renderTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const activeTab = document.getElementById('tab-' + tab);
  if (activeTab) activeTab.classList.add('active');

  let rows = allSheets;

  if (currentSupervisor?.role === 'reviewer') {
    if (tab === 'pending')  rows = allSheets.filter(s => s.status === 'pending');
    if (tab === 'reviewed') rows = allSheets.filter(s => s.status === 'reviewed');
  } else {
    if (tab === 'pending')  rows = allSheets.filter(s => s.status === 'reviewed');
    if (tab === 'approved') rows = allSheets.filter(s => s.status === 'approved');
  }

  document.getElementById('loading').style.display = 'none';

  if (rows.length === 0) {
    document.getElementById('sheet-table').style.display = 'none';
    document.getElementById('sheet-empty').style.display = 'block';
    document.getElementById('sheet-empty').textContent = 'No timesheets found.';
    return;
  }

  const tbody = document.getElementById('sheet-body');
  tbody.innerHTML = rows.map(s => {
    const date = new Date(s.submitted_at).toLocaleDateString();
    return `<tr>
      <td><strong>${s.employee_name}</strong><br><span style="font-size:12px;color:#888;">${s.employment_status}</span></td>
      <td>${s.month} ${s.year}</td>
      <td>${s.total_hours}</td>
      <td>${date}</td>
      <td>${getBadge(s.status)}</td>
      <td><button class="review-btn" onclick="window.location.href='/review.html?id=${s.id}'">${currentSupervisor?.role === 'reviewer' ? 'Review' : 'Review'}</button></td>
    </tr>`;
  }).join('');

  document.getElementById('sheet-table').style.display = 'table';
  document.getElementById('sheet-empty').style.display = 'none';
}

function showTab(tab) { renderTab(tab); }

async function signOut() {
  await sb.auth.signOut();
  window.location.href = '/supervisor.html';
}

init();
</script>
</body>
</html>
